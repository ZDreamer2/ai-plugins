name: Build and publish marketplace

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zd-plugins-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ZDreamer2/ai-plugins' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MARKETPLACE_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and independently validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -S -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -S ai-marketplace/scripts/build.py --dir "$GITHUB_WORKSPACE"
          python3 -B -S ai-marketplace/scripts/validate_pi.py --dir "$GITHUB_WORKSPACE" --tree "$GITHUB_WORKSPACE/@build/pi"
          printf '%s\n' "$GITHUB_SHA" > @build/source-revision
          printf '%s\n' "$GITHUB_SHA" > @build/builder-revision
          printf '%s\n' python > @build/builder-kind
          # Preserve executable modes inside the uploaded artifact.
          tar -cf marketplace.tar -C @build .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-${{ github.sha }}
          path: marketplace.tar
          retention-days: 7
          if-no-files-found: error
      - name: Publish Claude
        run: bash .github/publish.sh
        env:
          AGENT_TREE: claude
          SSH_PRIVATE_KEY_B64: ${{ secrets.CLAUDE_DEPLOY_KEY_B64 }}
      - name: Publish Codex
        run: bash .github/publish.sh
        env:
          AGENT_TREE: codex
          SSH_PRIVATE_KEY_B64: ${{ secrets.CODEX_DEPLOY_KEY_B64 }}
      - name: Publish Pi
        run: bash .github/publish.sh
        env:
          AGENT_TREE: pi
          SSH_PRIVATE_KEY_B64: ${{ secrets.PI_DEPLOY_KEY_B64 }}
